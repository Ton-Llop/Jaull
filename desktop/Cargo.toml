[package]
name = "jaull-desktop"
version = "0.1.0"
edition = "2021"
description = "Experimental lightweight desktop front end for Jaull (Slint, software renderer)."
publish = false

[dependencies]
slint = "1"
serde_json = "1"
# Plain HTTP to the local llama-server only: no TLS stack.
ureq = { version = "2", default-features = false, features = ["json"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
