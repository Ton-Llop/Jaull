[package]
name = "jaull-desktop"
version = "0.1.0"
edition = "2021"
description = "Experimental lightweight desktop front end for Jaull (Slint, software renderer)."
publish = false

[dependencies]
slint = "1"
serde_json = "1"
# HTTP to the local llama-server, and HTTPS when it is shared on the network. The chat trusts
# only Jaull's own self-signed certificate (no system roots are loaded).
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[build-dependencies]
slint-build = "1"
# Embeds icon.ico in the .exe (Explorer, taskbar, Start menu).
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
