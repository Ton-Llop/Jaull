name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The README roadmap lists what is already planned — workload/SLO modelling, load and
        capacity experiments, deployment qualification and a reproducible deployment
        manifest. If your idea is one of those, an issue describing your concrete use case
        is still useful; it helps shape the design.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Jaull get in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hardware / backend detection
        - Model inspection or estimation
        - Recommendation
        - Artifacts and downloads
        - Runtimes and execution
        - Experiments and benchmarks
        - CLI
        - TUI
        - Documentation
        - Other
    validations:
      required: false
