name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked fails the build if uv.lock is out of date with pyproject.toml,
      # so a forgotten `uv lock` cannot slip through review.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      # Generate coverage once on the canonical Linux/Python combination.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest --cov=jaull --cov-report=xml --cov-report=term

      # The remaining matrix entries still run the complete test suite.
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Build wheel and source distribution
        run: uv build

      # The TUI is unusable without its stylesheet, and a non-Python file is
      # exactly the kind of thing a packaging change silently drops. Verify the
      # artifacts rather than trusting that it works from the source tree.
      - name: Verify packaged artifacts
        run: uv run python scripts/check_dist.py

  # Installing the wheel into a clean environment proves the entry point and the
  # bundled Textual resources work outside the repository checkout.
  smoke-install:
    name: Installed-wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: |
          uv sync --locked
          uv build

      - name: Install the wheel into a throwaway environment
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl

      - name: Entry point works from the installed package
        run: |
          /tmp/smoke/bin/jaull --help
          /tmp/smoke/bin/jaull scan
          /tmp/smoke/bin/jaull doctor
          /tmp/smoke/bin/jaull estimate --help

      - name: Textual stylesheet is importable from the installed package
        run: |
          /tmp/smoke/bin/python -c "
          from pathlib import Path
          import jaull.tui.app as app
          css = Path(app.JaullApp.CSS_PATH)
          assert css.is_file(), f'missing stylesheet: {css}'
          assert css.stat().st_size > 0, 'stylesheet is empty'
          print(f'OK: {css} ({css.stat().st_size} bytes)')
          "