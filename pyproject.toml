[project]
name = "jaull"
version = "0.1.0"
description = "Analyze local hardware and Hugging Face model repositories to decide what fits where."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Antoni Llop" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "huggingface-hub>=0.24",
    # Imported directly by metadata/range_reader.py for the GGUF Range reads.
    # Also a huggingface-hub transitive dep, but declared explicitly: this
    # package must not depend on another package's dependency tree.
    "httpx>=0.27",
    "psutil>=5.9",
    "nvidia-ml-py>=12.560.30",
    "textual>=0.85",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "accelerate>=1.14.0",
]

# Development tooling is a dependency *group*, not an optional feature: it is
# for contributors (`uv sync` installs it by default) and is never published as
# an installable extra for end users.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil>=6.0",
]

[project.scripts]
jaull = "jaull.cli.app:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaull"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "C4",             # comprehensions
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Typer's canonical pattern places typer.Option/Argument calls as parameter defaults.
"src/jaull/cli/**" = ["B008"]
# Textual widgets use class-level BINDINGS/SCREENS lists by convention.
"src/jaull/tui/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml.*", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
