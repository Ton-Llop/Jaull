[project]
name = "local-ai-check"
version = "0.1.0"
description = "Analyze local hardware and Hugging Face model repositories to decide what fits where."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Antoni" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "huggingface-hub>=0.24",
    "psutil>=5.9",
    "nvidia-ml-py>=12.560.30",
    "textual>=0.85",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil>=6.0",
]

[project.scripts]
local-ai-check = "local_ai_check.cli.app:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_check"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "C4",             # comprehensions
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Typer's canonical pattern places typer.Option/Argument calls as parameter defaults.
"src/local_ai_check/cli/**" = ["B008"]
# Textual widgets use class-level BINDINGS/SCREENS lists by convention.
"src/local_ai_check/tui/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml.*", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
